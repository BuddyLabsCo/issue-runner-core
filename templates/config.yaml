# Edit this file and prompts/{implement,review,documentation}.md before running.
# Keep arguments and this file unchanged when resuming an interrupted Run.

repository: your-account/your-repository # GitHub owner/repo matching the checkout.
checkout: /absolute/path/to/your-repository # Absolute path; Windows: C:\work\your-repository.
# Positive Issue numbers: filters --parent; value-less --issue runs this list directly.
issueList: []
issueLabel: ready-for-agent # Eligibility label; empty/omitted disables filtering.
maxBatchSize: 2 # Maximum Issues selected and run concurrently per Batch; positive integer.
targetBranch: main # PR target; omit to use the repository's default branch.

operationRetry: 4 # Additional non-Agent operation attempts; nonnegative integer.
operationRetryDelay: [10, 20, 40, 80] # Retry delays in seconds; last value repeats.

# Maintenance Issue created by --document or the automatic trigger; all fields required when enabled.
maintenanceTicket:
  title: Maintain project documentation
  body: Update the documentation surfaces named by the documentation prompt.
  label: doc-maintain
workflow:
  review: true # Review implementations; requires agents.review and its prompt.
  # maxReviewRounds: 1 # Optional positive cap; final findings still receive a fix.
  docMaintainTriggerLabel: "" # Run documentation after a Batch delivers this label; empty disables.
tracker:
  tokenEnv: GH_TOKEN # Environment variable holding the GitHub Issue token; never put tokens here.
  runnerAccount: your-github-account # GitHub account assigned to reserved Issues.
  reservationLabel: sandcastle:reserved # Existing repository label marking reserved Issues.
codeHost:
  tokenEnv: GH_TOKEN # Environment variable holding the GitHub PR/checks/merge token.
  adminMerge: false # Use GitHub's administrator merge flag.

terminalPlugins:
  agentStartDelay: 10 # Seconds after command submission for Agents without an enhancement (0..2147483.647).
  # Shared options passed unchanged to every loaded Agent enhancement;
  enhancements:
    readyTimeout: 20 # Seconds per readiness attempt; finite, positive number.
    retryLimit: 3 # Recovery requests per Assignment, separately for errors and missing handoffs; 0 disables both.
    retryDelay: [10, 20, 40] # Seconds before error recovery; nonempty, nonnegative list; last value repeats.
    handoffRecoveryDelaySeconds: 120 # Seconds before each missing-handoff recovery request; finite, nonnegative number.

# Each role runs the configured shell commands; install and authenticate its Agent first.
agents:
  implement: # Required implementation role.
    agent: codebuddy # Identifier used to find optional issue-runner-agent-<agent> packages.
    # Windows PowerShell: start/resume use $env:CODEBUDDY_IS_SANDBOX="1"; codebuddy ...
    # Full shell command, sent unchanged; adapt quoting and flags to your shell.
    start: 'CODEBUDDY_IS_SANDBOX=1 codebuddy --port 0 --model deepseek-v4.1-flash --effort max --dangerously-skip-permissions'
    # Must contain {sessionref}; Runner replaces it with the saved native reference.
    resume: 'CODEBUDDY_IS_SANDBOX=1 codebuddy --port 0 --resume "{sessionref}" --dangerously-skip-permissions'
    submitKey: Enter # Task-input chord; defaults to Enter. Commands always launch with Enter.
  review: # Required when workflow.review is true.
    agent: codex
    start: 'codex --remote unix:// --model gpt-6.1-sol -c model_reasoning_effort="high" -c check_for_update_on_startup=false --dangerously-bypass-approvals-and-sandbox'
    resume: 'codex resume "{sessionref}" --remote unix:// -c check_for_update_on_startup=false --dangerously-bypass-approvals-and-sandbox'
    submitKey: Enter
  ciRepair: # Required CI repair role.
    agent: codebuddy
    # Windows PowerShell: start/resume use $env:CODEBUDDY_IS_SANDBOX="1"; codebuddy ...
    start: 'CODEBUDDY_IS_SANDBOX=1 codebuddy --port 0 --model deepseek-v4.1-flash --effort max --dangerously-skip-permissions'
    resume: 'CODEBUDDY_IS_SANDBOX=1 codebuddy --port 0 --resume "{sessionref}" --dangerously-skip-permissions'
    submitKey: Enter
  conflictRepair: # Required merge-conflict repair role.
    agent: codebuddy
    # Windows PowerShell: start/resume use $env:CODEBUDDY_IS_SANDBOX="1"; codebuddy ...
    start: 'CODEBUDDY_IS_SANDBOX=1 codebuddy --port 0 --model deepseek-v4.1-flash --effort max --dangerously-skip-permissions'
    resume: 'CODEBUDDY_IS_SANDBOX=1 codebuddy --port 0 --resume "{sessionref}" --dangerously-skip-permissions'
    submitKey: Enter
  documentation: # Required for --document or automatic documentation.
    agent: claude
    start: 'claude --model claude-opus-5-5 --effort high --dangerously-skip-permissions'
    resume: 'claude --resume "{sessionref}" --dangerously-skip-permissions'
    submitKey: Enter

# Timeouts in positive minutes.
timeouts:
  requiredChecksMinutes: 60 # Required; pause after waiting this long for required checks.
  mergeQueueMinutes: 60 # Required; pause after waiting this long for merge confirmation.
