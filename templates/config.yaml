# Created by the terminal command's init. Replace repository, checkout, and
# runnerAccount before running. Install the terminal package globally; it
# supplies Core as a runtime dependency. Custom npm prefixes are supported.
repository: your-account/your-repository
# Absolute checkout path; on Windows use e.g. C:\work\your-repository.
checkout: /absolute/path/to/your-repository
# Limits Parent selection, or supplies value-less --issue.
issueList: []
# Maximum selected Issues and concurrent executions in one Batch.
maxBatchSize: 2
# Omit targetBranch to use the repository's default branch.
targetBranch: main
# Non-Agent operation retries are additional attempts; delays are in seconds.
# The last delay repeats when the budget exceeds the schedule.
operationRetry: 4
operationRetryDelay: [10, 20, 40, 80]
ticketClosure: runner
maintenanceTicket:
  title: Maintain project documentation
  body: Update the documentation surfaces named by the documentation prompt.
  label: doc-maintain
workflow:
  # Review defaults to enabled. Omit maxReviewRounds for no round cap.
  # Every findings round gets a fix, including the final allowed round.
  # maxReviewRounds: 1 permits findings -> fix with no second Review.
  review: true
  # Exact case-sensitive delivery label. Empty/omitted disables automatic maintenance.
  docMaintainTriggerLabel: ""
tracker:
  tokenEnv: GH_TOKEN
  runnerAccount: your-github-account
  reservationLabel: sandcastle:reserved
codeHost:
  tokenEnv: GH_TOKEN
  adminMerge: false
# Core defaults: agentStartDelay: 10 (seconds), enhancements: {}.
# Delay must be finite, nonnegative, and at most 2147483.647 seconds.
# Enhancement values stay unknown; other fields belong to the terminal adapter.
# Core passes this object with defaults to the factory. Null/arrays/scalars fail.
terminalPlugins: {}
# Complete shell command strings, with shell-appropriate quoting supplied by you.
# Core does not choose an Agent brand, rebuild argv, or interpret native options.
# agent is a required opaque plugin identifier, preserved exactly as configured.
# Core discovers optional issue-runner-agent-<agent> packages in the terminal global prefix.
# Every resume command must contain the exact {sessionref} placeholder.
# submitKey is a Runner setting alongside start/resume, outside native options.
# Core coordinates command launch and readiness; base startup waits agentStartDelay.
agents:
  implement:
    agent: codebuddy
    # Windows PowerShell: start/resume use $env:CODEBUDDY_IS_SANDBOX="1"; codebuddy ...
    start: 'CODEBUDDY_IS_SANDBOX=1 codebuddy --model deepseek-v4.1-flash --effort max --dangerously-skip-permissions'
    resume: 'CODEBUDDY_IS_SANDBOX=1 codebuddy --resume "{sessionref}" --model deepseek-v4.1-flash --effort max --dangerously-skip-permissions'
    submitKey: Enter
  review:
    agent: codex
    start: 'codex --remote unix:// --model gpt-6.1-sol -c model_reasoning_effort="high" --dangerously-bypass-approvals-and-sandbox'
    resume: 'codex resume "{sessionref}" --model gpt-6.1-sol -c model_reasoning_effort="high" --dangerously-bypass-approvals-and-sandbox'
    submitKey: Enter
  ciRepair:
    agent: codebuddy
    # Windows PowerShell: start/resume use $env:CODEBUDDY_IS_SANDBOX="1"; codebuddy ...
    start: 'CODEBUDDY_IS_SANDBOX=1 codebuddy --model deepseek-v4.1-flash --effort max --dangerously-skip-permissions'
    resume: 'CODEBUDDY_IS_SANDBOX=1 codebuddy --resume "{sessionref}" --model deepseek-v4.1-flash --effort max --dangerously-skip-permissions'
    submitKey: Enter
  conflictRepair:
    agent: codebuddy
    # Windows PowerShell: start/resume use $env:CODEBUDDY_IS_SANDBOX="1"; codebuddy ...
    start: 'CODEBUDDY_IS_SANDBOX=1 codebuddy --model deepseek-v4.1-flash --effort max --dangerously-skip-permissions'
    resume: 'CODEBUDDY_IS_SANDBOX=1 codebuddy --resume "{sessionref}" --model deepseek-v4.1-flash --effort max --dangerously-skip-permissions'
    submitKey: Enter
  documentation:
    agent: claude
    start: 'claude --model claude-opus-5-5 --effort high --dangerously-skip-permissions'
    resume: 'claude --resume "{sessionref}" --model claude-opus-5-5 --effort high --dangerously-skip-permissions'
    submitKey: Enter
# Positive minute thresholds retained for downstream delivery slices.
# agentIdleMinutes is optional and defaults to 10.
timeouts:
  agentMinutes: 120
  agentIdleMinutes: 10
  requiredChecksMinutes: 60
  mergeQueueMinutes: 60
