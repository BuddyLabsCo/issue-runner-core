name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    if: false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - name: Check formatting, lint, and types
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee verification.log
      - name: Verify workflows, real Git, and installed packages
        shell: bash
        run: |
          set -o pipefail
          export I178_TRACE_DIR="$PWD/diagnostic-traces"
          export NODE_OPTIONS="--import=$(node -p "require('node:url').pathToFileURL(process.cwd() + '/scripts/issue-178-preload.mjs').href")"
          npm test 2>&1 | tee -a verification.log
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-verification-${{ matrix.os }}
          path: |
            verification.log
            diagnostic-traces/
          if-no-files-found: ignore
          retention-days: 7

  timing-diagnostics:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - name: Observe original deadlines without releasing blocked work
        shell: bash
        run: |
          mkdir -p diagnostic-traces
          export I178_TRACE_DIR="$PWD/diagnostic-traces"
          export NODE_OPTIONS="--import=$(node -p "require('node:url').pathToFileURL(process.cwd() + '/scripts/issue-178-preload.mjs').href")"
          export I178_OBSERVE=1
          for pressure in 0 1; do
            export I178_PRESSURE="$pressure"
            if [ "$pressure" = 1 ]; then
              node scripts/issue-178-pressure.mjs &
              pressure_pid=$!
              trap 'kill "$pressure_pid" 2>/dev/null || true' EXIT
            fi
            for iteration in $(seq 1 10); do
              echo "[I178-RUN] pressure=$pressure iteration=$iteration"
              node --test --test-concurrency=4 --test-name-pattern='bounded Batch concurrently|sibling.*non-Agent pause' tests/run/cli-batch.test.ts tests/run/cli-cancellation.test.ts || exit 1
            done
          done
      - name: Retain timing evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-178-timing-traces
          path: diagnostic-traces/
          retention-days: 7
