name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-merge:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      skip: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/github-script@v9
        id: release
        with:
          script: |
            const pulls = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { ...context.repo, commit_sha: context.sha },
            );
            return pulls.some(pr =>
              pr.merged_at &&
              pr.merge_commit_sha === context.sha &&
              pr.base.ref === 'main' &&
              pr.head.ref === 'auto-release' &&
              pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`
            );

  checks:
    needs: release-merge
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.release-merge.outputs.skip == 'false') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - name: Check formatting, lint, and types
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee verification.log
      - name: Verify workflows, real Git, and installed packages
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee -a verification.log
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-verification-${{ matrix.os }}
          path: verification.log
          if-no-files-found: ignore
          retention-days: 7
